<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Showreel 2026</title>
<style>
  @font-face { font-family: 'Archivo Black'; src: url(fonts/archivo-black-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'JB'; src: url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 800; src: url(fonts/inter-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 500; src: url(fonts/inter-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Serif'; font-style: italic; src: url(fonts/instrument-serif-latin-400-italic.woff2) format('woff2'); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
  body.preview { display: grid; place-items: center; height: 100vh; cursor: pointer; }
  body.preview canvas { width: min(100vw, 177.78vh); height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="reel.js"></script>
</body>
</html>
